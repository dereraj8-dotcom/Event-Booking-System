
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventGo - Registration</title>
    <link rel="stylesheet" href="common.css">

    <style>
        body {
            min-height: 100vh;
            background: #f8f8f8;
            display: flex;
            flex-direction: column;
        }

      

        .registration-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .registration-container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }

        .registration-container h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .registration-container h1 span {
            color: var(--pink);
        }

        .registration-container .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(117, 81, 209, 0.1);
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender label {
            font-weight: normal;
            margin: 0;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .register-submit {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .register-submit:hover {
            background: var(--pink-dark);
        }

        .reset-btn {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: var(--light);
        }

        .login-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #777;
        }

        .login-text a {
            color: var(--pink);
            text-decoration: none;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .registration-section {
                padding: 25px 15px;
            }

            .registration-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <div class="logo-icon">
                <img src="logo_event.jpeg" alt="EventGo Logo">
            </div>
            Event<span class="logo-go">Go</span>
        </div>

        <div class="nav-links">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Events.html">Events</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="#">My Bookings</a></li>
                <li><a href="About_us.html">About Us</a></li>
                <li><a href="contacts.html">Contact</a></li>
            </ul>
        </div>

        <div class="nav-buttons">
            <button onclick="window.location.href='login_page.html'" class="login-btn">Login</button>
            <button onclick="window.location.href='registration_page.html'" class="register-btn">Register</button>
        </div>
    </nav>

    <section class="registration-section">

        <div class="registration-container">

            <h1>Join Event<span>Go</span></h1>

            <p class="subtitle">
                Create your account and start booking amazing events.
            </p>

            <form method="post" action="index.html">

                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>
                </div>


                <div class="form-group">
                    <label for="email">E-mail ID</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required>
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>
                </div>


                <div class="form-group">
                    <label for="dob">Date of Birth</label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required>
                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="male"
                                required>
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="female">
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="other">
                            Other
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your address"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary register-submit">
                    Create Account
                </button>

                <button
                    type="reset"
                    class="btn btn-outline reset-btn">
                    Reset
                </button>


                <p class="login-text">
                    Already have an account?
                    <a href="login page.html">Login here</a>
                </p>

            </form>

        </div>

    </section>

</body>
</html>
