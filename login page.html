<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button{
            display: block;
    margin: 10px auto;
    padding: 8px 20px;
    border: 1px solid black;
    border-radius: 5px;
    cursor: pointer;
        }
        main{
          display: flex;
          align-items: center;
          margin-bottom: 15px;
          
        }
        div{
            border: 2px solid black;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div>
        <div class="main">
            <label>Username</label>
            <input type="text" placeholder="Enter Username"><br>
            <label>Password</label>
            <input type="password" placeholder="Enter Password">
        </div>
        <button type="submit" value="Login">Login</button>
    </div>

</body>

</html>
