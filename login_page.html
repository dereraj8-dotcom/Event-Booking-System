<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventGo - Login</title>
    <link rel="stylesheet" href="common.css">

    <style>
        body {
            min-height: 100vh;
            background: #f8f8f8;
            display: flex;
            flex-direction: column;
        }

        /* Login Section */

        .login-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }

        .login-container h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .login-container h1 span {
            color: var(--pink);
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(117, 81, 209, 0.1);
        }

        .forgot-password {
            display: flex;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--pink);
            text-decoration: none;
            font-size: 13px;
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-submit:hover {
            background: var(--pink-dark);
        }

        .register-text {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 20px;
        }

        .register-text a {
            color: var(--pink);
            text-decoration: none;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-section {
                padding: 25px 15px;
            }

            .login-container {
                width: 100%;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            <div class="logo-icon">
                <img src="logo_event.jpeg" alt="EventGo Logo">
            </div>
            Event<span class="logo-go">Go</span>
        </div>

        <div class="nav-links">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Events.html">Events</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="#">My Bookings</a></li>
                <li><a href="About_us.html">About Us</a></li>
                <li><a href="contacts.html">Contact</a></li>
            </ul>
        </div>

        <div class="nav-buttons">
            <button onclick="window.location.href='login_page.html'" class="login-btn">Login</button>
            <button onclick="window.location.href='registration_page.html'" class="register-btn">Register</button>
        </div>
    </nav>


    <!-- Login Form -->

    <section class="login-section">

        <div class="login-container">

            <h1>
                Welcome to Event<span>Go</span>
            </h1>

            <p class="subtitle">
                Login to continue booking your favorite events.
            </p>


            <form method="post" action="index.html">

                <div class="form-group">

                    <label for="email">
                        Username
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-submit">
                    Login
                </button>


                <p class="register-text">

                    Don't have an account?

                    <a href="registration page.html">
                        Register here
                    </a>

                </p>

            </form>

        </div>

    </section>

</body>
</html>
