
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventGo - Payment Receipt</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .receipt {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ddd;
        }

        .logo {
            color: #e84c9a;
            font-size: 32px;
            font-weight: bold;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 2px solid #e84c9a;
            padding-bottom: 20px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin: 20px;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .receipt {
                box-shadow: none;
            }

            .no-print {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="receipt">

        <div class="receipt-header">
            <div class="logo">EventGo</div>
            <p>Your Gateway to Unforgettable Events</p>
            <h3>PAYMENT RECEIPT</h3>
        </div>

        <h5 class="success" id="paymentStatus"></h5>

        <div class="row mt-4">
            <div class="col-md-6">
                <h5>Customer Details</h5>
                <p id="customerDetails"></p>
            </div>

            <div class="col-md-6">
                <h5>Receipt Details</h5>
                <p id="receiptDetails"></p>
            </div>
        </div>

        <h5 class="mt-4">Event Details</h5>

        <div class="table-responsive">
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="receiptTable"></tbody>
            </table>
        </div>

        <div class="total" id="totalAmount"></div>

        <div class="mt-4">
            <h5>Payment Information</h5>
            <p id="paymentDetails"></p>
        </div>

        <div class="text-center mt-5">
            <h5>Thank You for Booking with EventGo!</h5>
            <p>We look forward to seeing you.</p>
            <p>support@eventgo.com | +91 98765 43210</p>
        </div>

        <div class="text-center mt-4 no-print">
            <button class="btn btn-success" onclick="window.print()">
                Print / Download Receipt
            </button>

            <button class="btn btn-secondary"
                onclick="window.location.href='Events.html'">
                Back to Events
            </button>
        </div>

    </div>

    <script>

let bookings = JSON.parse(localStorage.getItem("eventGoBookings")) || [];

let confirmedBookings = bookings.filter(function(item) {
    return item.status === "Confirmed";
});

if (confirmedBookings.length === 0) {
    document.querySelector(".receipt").innerHTML =
        "<h3 class='text-center'>No booking found!</h3>";
} else {

    let customer = confirmedBookings[0];

    let totalAmount = 0;

    document.getElementById("paymentStatus").textContent =
        customer.paymentStatus === "Paid"
        ? "✓ Payment Successful"
        : "Booking Confirmed - Payment Pending";

    document.getElementById("customerDetails").innerHTML = `
        <strong>Name:</strong> ${customer.customerName}<br>
        <strong>Email:</strong> ${customer.customerEmail}<br>
        <strong>Phone:</strong> ${customer.customerPhone}
    `;

    document.getElementById("receiptDetails").innerHTML = `
        <strong>Receipt No:</strong> ${customer.receiptNumber || "N/A"}<br>
        <strong>Booking Date:</strong> ${customer.bookingDate || "N/A"}
    `;

    let tableCode = "";

    confirmedBookings.forEach(function(item) {

        let total = item.price * item.quantity;
        totalAmount += total;

        tableCode += `
            <tr>
                <td>${item.name}</td>
                <td>${item.date}</td>
                <td>${item.venue}</td>
                <td>${item.quantity}</td>
                <td>₹${item.price}</td>
                <td>₹${total}</td>
            </tr>
        `;
    });

    document.getElementById("receiptTable").innerHTML = tableCode;

    document.getElementById("totalAmount").textContent =
        "Total Amount: ₹" + totalAmount;

    document.getElementById("paymentDetails").innerHTML = `
        <strong>Payment Method:</strong> ${customer.paymentMethod}<br>
        <strong>Payment Status:</strong> ${customer.paymentStatus}
    `;
}

    </script>

</body>
</html>
